<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guru Beleq - Gendang Beleq Teacher</title>
<link rel="icon" href="/avatar.png">
<style>
  :root { --brown:#5b3a24; --brown-dark:#462b19; --red:#b3262d; --cream:#fbf4e6; --tan:#ecdcc0; --tan-dark:#dcc49c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Segoe UI, sans-serif; background:var(--cream); color:#2b1d12;
         height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { width:100%; background:var(--brown); color:#fff; padding:10px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header img { width:48px; height:48px; border-radius:50%; background:var(--cream); }
  header h1 { font-size:1.15rem; margin:0; }
  header small { opacity:.85; display:block; }
  #status { margin-left:auto; text-align:right; font-size:.85rem; margin-right:6px; }
  #bar { height:6px; width:130px; background:#ffffff40; border-radius:3px; margin-top:4px; margin-left:auto; overflow:hidden; }
  #bar div { height:100%; width:0; background:var(--red); transition:width .3s; }
  button.small { background:transparent; color:#fff; border:1px solid #fff8; border-radius:6px; padding:6px 10px; cursor:pointer; font-size:.85rem; }
  button.small:hover { background:#ffffff18; }
  #chat { flex:1; width:100%; max-width:780px; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; line-height:1.45; }
  .bot { background:var(--tan); align-self:flex-start; border-bottom-left-radius:4px; }
  .user { background:var(--red); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  #quickbar { width:100%; max-width:780px; padding:6px 16px 0; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip { background:var(--tan); color:#2b1d12; border:1px solid var(--tan-dark); border-radius:999px; padding:5px 11px;
          font-size:.83rem; cursor:pointer; transition:background .15s, transform .1s; }
  .chip:hover { background:var(--tan-dark); }
  .chip.primary { background:var(--brown); color:#fff; border-color:var(--brown); }
  .chip.primary:hover { background:var(--brown-dark); }
  select.chip-select { background:var(--tan); color:#2b1d12; border:1px solid var(--tan-dark); border-radius:999px;
                       padding:5px 10px; font-size:.83rem; cursor:pointer; }
  form#form { width:100%; max-width:780px; display:flex; gap:8px; padding:10px 16px 16px; }
  input#box { flex:1; padding:12px 14px; border:2px solid var(--tan); border-radius:10px; font-size:1rem; background:#fff; }
  input#box:focus { outline:none; border-color:var(--red); }
  form#form button { padding:0 22px; border:0; border-radius:10px; background:var(--brown); color:#fff; font-size:1rem; cursor:pointer; }
  form#form button:disabled { opacity:.5; }
  .modal { position:fixed; inset:0; background:#0008; display:none; align-items:center; justify-content:center; padding:12px; z-index:20; }
  .modal.open { display:flex; }
  .modalbox { background:#fff; border-radius:12px; max-width:680px; width:100%; max-height:90vh; overflow-y:auto; padding:18px 20px; }
  .modalbox h2 { margin:0 0 4px; }
  .modalbox p.hint { margin:0 0 12px; color:#555; font-size:.9rem; }
  .tabs { display:flex; gap:6px; border-bottom:2px solid var(--tan); margin-bottom:12px; padding-bottom:8px; }
  .tabbtn { background:var(--tan); color:#2b1d12; border:0; border-radius:8px; padding:7px 14px; cursor:pointer; font-weight:600; font-size:.9rem; }
  .tabbtn.active { background:var(--brown); color:#fff; }
  .tabpane { display:none; }
  .tabpane.active { display:block; }
  .card { background:var(--cream); border:1px solid var(--tan-dark); border-radius:10px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .card-title { font-weight:700; color:var(--brown); }
  .card-sub { font-size:.88rem; color:#443020; margin-top:2px; }
  .badge-pill { display:inline-block; font-size:.75rem; padding:2px 8px; border-radius:999px; background:var(--tan); color:#2b1d12; margin-left:6px; }
  .badge-pill.done { background:#d4edda; color:#155724; }
  #gsearch { width:100%; padding:8px 12px; border:2px solid var(--tan); border-radius:8px; margin-bottom:10px; font-size:.92rem; }
  .q { padding:8px 0; border-bottom:1px solid var(--tan); }
  .q .opts { display:flex; gap:14px; margin-top:4px; }
  .q label { cursor:pointer; }
  .modalbox textarea { width:100%; margin-top:10px; padding:8px; border:2px solid var(--tan); border-radius:8px; font:inherit; }
  .row { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  .row button { padding:9px 18px; border:0; border-radius:8px; cursor:pointer; background:var(--brown); color:#fff; font-size:.95rem; }
  .row button.alt { background:var(--tan); color:#2b1d12; }
  #cuqmsg { color:var(--red); margin-top:8px; }
</style>
</head>
<body>
<header>
  <img src="/avatar.png" alt="Guru Beleq avatar">
  <div><h1>Guru Beleq</h1><small>Your Gendang Beleq teacher</small></div>
  <div id="status"><span id="badge"></span><div id="bar"><div></div></div></div>
  <button class="small" id="explore">Explore knowledge</button>
  <button class="small" id="export">Export chat</button>
  <button class="small" id="rate">Rate this chatbot</button>
  <button class="small" id="restart">Start over</button>
</header>
<div id="chat" aria-live="polite"></div>
<div id="quickbar" aria-label="Quick actions"></div>
<form id="form">
  <input id="box" autocomplete="off" placeholder="Type here..." autofocus>
  <button id="send">Send</button>
</form>

<!-- Explore Knowledge Modal (Glossary, Lessons, Semantic Network) -->
<div id="exploreModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="exploreTitle">
  <div class="modalbox">
    <h2 id="exploreTitle">Explore Gendang Beleq Knowledge</h2>
    <p class="hint">Browse lessons, search the 17-term Sasak glossary, or inspect the cited semantic network.</p>
    <div class="tabs">
      <button type="button" class="tabbtn active" data-tab="tab-lessons">Lessons (6)</button>
      <button type="button" class="tabbtn" data-tab="tab-glossary">Sasak Glossary (17)</button>
      <button type="button" class="tabbtn" data-tab="tab-net">Semantic Network (24)</button>
    </div>
    <div id="tab-lessons" class="tabpane active"></div>
    <div id="tab-glossary" class="tabpane">
      <input id="gsearch" type="search" placeholder="Search Sasak or musical terms (e.g. petuq, nyongkolan, sapuk)...">
      <div id="glist"></div>
    </div>
    <div id="tab-net" class="tabpane"></div>
    <div class="row"><button type="button" class="alt" id="exploreClose">Close</button></div>
  </div>
</div>

<!-- CUQ Modal -->
<div id="cuq" class="modal" role="dialog" aria-modal="true" aria-labelledby="cuqtitle"><div class="modalbox">
  <h2 id="cuqtitle">Rate this chatbot</h2>
  <p class="hint" id="scale"></p>
  <form id="cuqform" style="display:block;padding:0;max-width:none"><div id="qs"></div>
    <textarea id="comments" rows="3" placeholder="Comments (optional)"></textarea>
    <div id="cuqmsg"></div>
    <div class="row"><button type="button" class="alt" id="cuqclose">Close</button><button id="cuqsubmit">Submit</button></div>
  </form>
</div></div>

<script>
const chat = document.getElementById('chat'), box = document.getElementById('box'), send = document.getElementById('send');
const quickbar = document.getElementById('quickbar');
let tid = null, currentStage = 'ask_name', currentProgress = null, meta = null, historyLog = [];

function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  historyLog.push({role: role === 'bot' ? 'Guru Beleq' : 'You', text});
}

function showProgress(p) {
  currentProgress = p;
  const quiz = p && p.quiz_total ? ` · Quiz ${p.quiz_right}/${p.quiz_total}` : '';
  document.getElementById('badge').textContent = p ? `${p.badge} · Lessons ${p.done}/${p.total}${quiz}` : '';
  document.querySelector('#bar div').style.width = p ? (100 * p.done / p.total) + '%' : '0';
}

function makeChip(label, msg, primary = false) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip' + (primary ? ' primary' : '');
  b.textContent = label;
  b.onclick = () => sendMessage(msg);
  return b;
}

function renderQuickbar(stage) {
  currentStage = stage || 'menu';
  quickbar.innerHTML = '';
  if (currentStage === 'ask_name') return;
  if (currentStage === 'lesson') {
    quickbar.append(
      makeChip('💡 Hint', 'hint', true),
      makeChip('🔁 Repeat step', 'repeat'),
      makeChip('⏭️ Skip question', 'skip'),
      makeChip('⏹️ Leave lesson', 'stop')
    );
    return;
  }
  if (currentStage === 'quiz') {
    quickbar.append(
      makeChip('💡 Hint', 'hint', true),
      makeChip('⏭️ Skip question', 'skip'),
      makeChip('⏹️ Stop quiz', 'stop')
    );
    return;
  }
  // menu stage
  quickbar.append(
    makeChip('1. Start lesson', '1', true),
    makeChip('2. Ask question', '2'),
    makeChip('3. Take quiz', '3'),
    makeChip('4. Recommend', '4'),
    makeChip('5. Progress', '5'),
    makeChip('6. Help', '6'),
    makeChip('7. Sources', '7'),
    makeChip('8. Glossary', '8')
  );
  if (meta && meta.topics) {
    const sel = document.createElement('select');
    sel.className = 'chip-select';
    sel.setAttribute('aria-label', 'Jump to a specific lesson');
    const def = document.createElement('option');
    def.value = '';
    def.textContent = 'Choose a lesson topic...';
    sel.appendChild(def);
    meta.topics.forEach((t, idx) => {
      const o = document.createElement('option');
      o.value = `teach me about ${t.title.toLowerCase()}`;
      o.textContent = `Lesson ${idx + 1}: ${t.title}`;
      sel.appendChild(o);
    });
    sel.onchange = () => { if (sel.value) { sendMessage(sel.value); sel.value = ''; } };
    quickbar.appendChild(sel);
  }
}

async function post(url, body) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body || {})});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function loadMeta() {
  if (meta) return meta;
  try { meta = await (await fetch('/api/meta')).json(); } catch { meta = null; }
  return meta;
}

async function begin() {
  chat.innerHTML = ''; historyLog = []; showProgress(null);
  await loadMeta();
  try {
    const d = await post('/api/start');
    tid = d.thread_id;
    add('bot', d.reply);
    renderQuickbar(d.stage || 'ask_name');
  } catch {
    add('bot', 'Sorry, I could not reach the server. Is server.py running?');
  }
}

async function sendMessage(text) {
  const clean = (text || '').trim();
  if (!clean || !tid || send.disabled) return;
  box.value = ''; add('user', clean); send.disabled = true;
  try {
    const d = await post('/api/chat', {thread_id: tid, message: clean});
    add('bot', d.reply);
    showProgress(d.progress);
    renderQuickbar(d.stage || 'menu');
  } catch {
    add('bot', 'Sorry, something went wrong talking to the server.');
  }
  send.disabled = false; box.focus();
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  sendMessage(box.value);
});
document.getElementById('restart').onclick = begin;

// ---- Export Chat Transcript ----
document.getElementById('export').onclick = () => {
  if (!historyLog.length) return;
  const header = `Guru Beleq - Learning Transcript\n` +
    (currentProgress ? `Status: ${currentProgress.badge} | Lessons: ${currentProgress.done}/${currentProgress.total} | Quiz: ${currentProgress.quiz_right}/${currentProgress.quiz_total}\n` : '') +
    `==================================================\n\n`;
  const body = historyLog.map(m => `[${m.role}]\n${m.text}\n`).join('\n');
  const blob = new Blob([header + body], {type: 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'guru-beleq-transcript.txt';
  a.click();
  URL.revokeObjectURL(a.href);
};

// ---- Explore Knowledge Modal ----
const exploreModal = document.getElementById('exploreModal');
document.querySelectorAll('.tabbtn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tabbtn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tabpane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  };
});

function renderExplore() {
  if (!meta) return;
  const doneSet = new Set((currentProgress && currentProgress.lessons_done) || []);
  const lessonsEl = document.getElementById('tab-lessons');
  lessonsEl.innerHTML = '';
  meta.topics.forEach((t, i) => {
    const c = document.createElement('div'); c.className = 'card';
    const left = document.createElement('div');
    const title = document.createElement('div'); title.className = 'card-title';
    title.textContent = `Lesson ${i + 1}: ${t.title}`;
    const pill = document.createElement('span');
    pill.className = 'badge-pill' + (doneSet.has(t.id) ? ' done' : '');
    pill.textContent = doneSet.has(t.id) ? '✓ Completed' : 'To learn';
    title.appendChild(pill);
    const sub = document.createElement('div'); sub.className = 'card-sub';
    sub.textContent = t.summary;
    left.append(title, sub);
    const act = document.createElement('button');
    act.type = 'button'; act.className = 'chip primary';
    act.textContent = 'Start lesson';
    act.onclick = () => {
      exploreModal.classList.remove('open');
      sendMessage(`teach me about ${t.title.toLowerCase()}`);
    };
    c.append(left, act);
    lessonsEl.appendChild(c);
  });

  renderGlossaryList('');
  const netEl = document.getElementById('tab-net');
  netEl.innerHTML = '';
  meta.edges.forEach(e => {
    const c = document.createElement('div'); c.className = 'card';
    const d = document.createElement('div');
    d.innerHTML = `<span class="card-title"></span> &rarr; <em></em> &rarr; <span class="card-title"></span> <small></small>`;
    const spans = d.querySelectorAll('.card-title');
    spans[0].textContent = e.s;
    spans[1].textContent = e.o;
    d.querySelector('em').textContent = e.r;
    d.querySelector('small').textContent = e.cite;
    c.appendChild(d);
    netEl.appendChild(c);
  });
}

function renderGlossaryList(filter) {
  if (!meta) return;
  const glist = document.getElementById('glist');
  glist.innerHTML = '';
  const q = (filter || '').toLowerCase();
  meta.glossary.filter(g => !q || g.term.toLowerCase().includes(q) || g.meaning.toLowerCase().includes(q)).forEach(g => {
    const c = document.createElement('div'); c.className = 'card';
    const left = document.createElement('div');
    const t = document.createElement('div'); t.className = 'card-title'; t.textContent = g.term;
    const m = document.createElement('div'); m.className = 'card-sub'; m.textContent = `${g.meaning} ${g.cite}`;
    left.append(t, m);
    const askBtn = document.createElement('button');
    askBtn.type = 'button'; askBtn.className = 'chip';
    askBtn.textContent = 'Ask Guru';
    askBtn.onclick = () => {
      exploreModal.classList.remove('open');
      sendMessage(`what is ${g.term}?`);
    };
    c.append(left, askBtn);
    glist.appendChild(c);
  });
}

document.getElementById('gsearch').addEventListener('input', e => renderGlossaryList(e.target.value));
document.getElementById('explore').onclick = async () => {
  await loadMeta();
  renderExplore();
  exploreModal.classList.add('open');
};
document.getElementById('exploreClose').onclick = () => exploreModal.classList.remove('open');

// ---- Chatbot Usability Questionnaire (CUQ) ----
const cuqEl = document.getElementById('cuq'), cuqMsg = document.getElementById('cuqmsg');
let cuqLoaded = false;
async function openCuq() {
  cuqEl.classList.add('open'); cuqMsg.textContent = '';
  if (cuqLoaded) return;
  const d = await (await fetch('/api/cuq')).json();
  document.getElementById('scale').textContent = d.scale + '. Your answers are anonymous.';
  const qs = document.getElementById('qs');
  d.items.forEach((item, i) => {
    const q = document.createElement('div'); q.className = 'q';
    q.append(`${i + 1}. ${item}`);
    const o = document.createElement('div'); o.className = 'opts';
    for (let v = 1; v <= 5; v++) {
      const l = document.createElement('label'), r = document.createElement('input');
      r.type = 'radio'; r.name = 'q' + i; r.value = v; r.style.cssText = 'flex:none;width:auto;padding:0;border:0;margin-right:3px';
      l.append(r, v); o.append(l);
    }
    q.append(o); qs.append(q);
  });
  cuqLoaded = true;
}
document.getElementById('rate').onclick = () => openCuq().catch(() => alert('Could not load the questionnaire.'));
document.getElementById('cuqclose').onclick = () => cuqEl.classList.remove('open');
document.getElementById('cuqform').addEventListener('submit', async e => {
  e.preventDefault();
  const answers = [];
  for (let i = 0; i < 16; i++) {
    const c = document.querySelector(`input[name=q${i}]:checked`);
    if (!c) { cuqMsg.textContent = `Please answer question ${i + 1}.`; return; }
    answers.push(+c.value);
  }
  try {
    const d = await post('/api/cuq', {answers, comments: document.getElementById('comments').value});
    cuqMsg.style.color = '#1b6e2d';
    cuqMsg.textContent = `Thank you! Your score: ${d.score} out of 100.`;
    document.getElementById('cuqform').reset();
    setTimeout(() => { cuqEl.classList.remove('open'); cuqMsg.style.color = ''; }, 2500);
  } catch { cuqMsg.textContent = 'Sorry, your answers could not be saved.'; }
});
begin();
</script>
</body>
</html>
