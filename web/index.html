<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guru Beleq - Gendang Beleq Teacher</title>
<link rel="icon" href="/avatar.png">
<style>
  :root {
    --brown:#5b3a24; --brown-dark:#3e2515; --red:#b3262d;
    --cream:#fbf4e6; --tan:#ecdcc0; --tan-dark:#d7be96;
    --glass:rgba(255, 250, 242, 0.86);
    --glass-bot:rgba(255, 252, 245, 0.94);
  }
  * { box-sizing: border-box; }
  body {
    margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    color:#2b1d12; height:100vh; overflow:hidden;
    display:flex; flex-direction:column;
    background: linear-gradient(125deg, #b8e1fc 0%, #def2ff 28%, #f5ead8 28.2%, #efe0c9 68%, #e4cfb0 100%);
  }

  /* Ambient Replika-style room architectural details */
  .room-bg {
    position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
  }
  .room-window {
    position:absolute; left:-4%; top:0; width:44%; height:100%;
    background: linear-gradient(180deg, #89c8f7 0%, #bfe4ff 55%, #e8f5ff 85%, #d6e6c3 100%);
    border-right: 18px solid #f4e9d8;
    border-top-right-radius: 260px;
    box-shadow: inset -12px 0 30px rgba(91,58,36,0.08), 12px 0 40px rgba(43,29,18,0.08);
  }
  .room-shelf-1, .room-shelf-2 {
    position:absolute; right:0; height:18px; background:#f8efe2;
    border-bottom:4px solid #dcc8ad; border-top-left-radius:16px; border-bottom-left-radius:16px;
    box-shadow: 0 10px 24px rgba(91,58,36,0.08);
  }
  .room-shelf-1 { top:24%; width:34%; }
  .room-shelf-2 { top:48%; width:26%; }

  /* Floating Top Navigation Bar (Replika style) */
  header {
    position:relative; z-index:10;
    width:100%; padding:12px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .brand-cluster {
    display:flex; align-items:center; gap:10px;
  }
  .brand-mark {
    width:42px; height:42px; border-radius:50%; background:var(--brown); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.15rem;
    box-shadow: 0 4px 14px rgba(43,29,18,0.18); border:2px solid #fff8;
  }
  .lvl-pill {
    background: linear-gradient(135deg, #6bbf59, #4ca64c);
    color:#fff; padding:6px 14px; border-radius:999px; font-size:.84rem; font-weight:700;
    box-shadow: 0 4px 14px rgba(76,166,76,0.3);
    display:flex; align-items:center; gap:8px;
  }
  #bar {
    height:6px; width:72px; background:rgba(255,255,255,0.35); border-radius:3px; overflow:hidden;
  }
  #bar div { height:100%; width:0; background:#fff; transition:width .35s ease; }

  .nav-pills {
    background: rgba(91, 58, 36, 0.78); backdrop-filter: blur(12px);
    padding:5px 8px; border-radius:999px; display:flex; align-items:center; gap:4px;
    box-shadow: 0 6px 20px rgba(43,29,18,0.16);
  }
  .nav-pill {
    background:transparent; color:#fff; border:0; border-radius:999px;
    padding:7px 14px; font-size:.86rem; font-weight:600; cursor:pointer;
    transition: background .15s, transform .1s; display:flex; align-items:center; gap:6px;
  }
  .nav-pill:hover { background:rgba(255,255,255,0.16); }
  .nav-pill.active { background:rgba(255,255,255,0.25); }

  .action-cluster { display:flex; align-items:center; gap:6px; }
  button.small {
    background: rgba(91, 58, 36, 0.78); backdrop-filter: blur(10px);
    color:#fff; border:1px solid rgba(255,255,255,0.25); border-radius:999px;
    padding:7px 13px; cursor:pointer; font-size:.82rem; font-weight:600;
    transition: background .15s;
  }
  button.small:hover { background: var(--brown); }

  /* Main Split Workspace: Left Avatar Companion + Right Chat Stream */
  .stage-layout {
    position:relative; z-index:5;
    flex:1; width:100%; max-width:1260px; margin:0 auto;
    display:grid; grid-template-columns: 390px 1fr;
    gap:12px; min-height:0; padding:0 18px 12px;
  }

  /* Left Companion Stage */
  #avatar-stage {
    position:relative; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    padding-bottom:14px; user-select:none;
    perspective: 900px;
  }
  #puppet-wrap {
    position:relative; width:100%; max-width:350px; height:430px;
    display:flex; align-items:center; justify-content:center;
    transform-style: preserve-3d;
    transition: transform 0.12s ease-out;
    cursor:pointer;
  }
  #guru-puppet {
    width:100%; height:100%; overflow:visible;
    filter: drop-shadow(0 18px 28px rgba(43,29,18,0.22));
  }
  #particles {
    position:absolute; inset:0; pointer-events:none; overflow:visible;
  }
  .particle {
    position:absolute; font-size:1.45rem; font-weight:800; pointer-events:none;
    animation: floatUp 1.35s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes floatUp {
    0% { opacity:0; transform: translateY(10px) scale(0.6); }
    20% { opacity:1; transform: translateY(-6px) scale(1.1); }
    100% { opacity:0; transform: translateY(-85px) scale(0.95) rotate(12deg); }
  }

  .companion-card {
    background: rgba(43, 29, 18, 0.76); backdrop-filter: blur(10px);
    color:#fff; border-radius:16px; padding:10px 16px; width:92%; max-width:310px;
    box-shadow: 0 8px 24px rgba(43,29,18,0.22); border:1px solid rgba(255,255,255,0.18);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .companion-card h2 { margin:0; font-size:.98rem; }
  .companion-card small { opacity:.82; font-size:.78rem; display:block; }
  #mood-pill {
    background: rgba(255,255,255,0.18); padding:4px 10px; border-radius:999px;
    font-size:.78rem; font-weight:600; white-space:nowrap;
  }

  /* Puppet Skeletal Animations */
  #rig-character {
    transform-origin: 180px 390px;
    animation: breathe 3.6s ease-in-out infinite;
  }
  #arm-left { transform-origin: 92px 250px; transition: transform 0.3s ease; }
  #arm-right { transform-origin: 248px 255px; transition: transform 0.3s ease; }
  #rig-head { transform-origin: 162px 215px; transition: transform 0.3s ease; }
  #rig-glasses { transform-origin: 158px 210px; transition: transform 0.3s ease; }
  #brow-l { transform-origin: 130px 182px; transition: transform 0.25s ease; }
  #brow-r { transform-origin: 184px 182px; transition: transform 0.25s ease; }
  #pupil-l, #pupil-r { transition: transform 0.15s ease-out; }
  #lid-l, #lid-r {
    transform-origin: center top;
    animation: blink 4.8s infinite;
  }
  #eyes-happy, #mouth-talk, #mouth-grin, #mouth-think, #mouth-comfort { display:none; }

  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-5px) scale(1.01, 0.995); }
  }
  @keyframes blink {
    0%, 94%, 100% { transform: scaleY(0); }
    96%, 98% { transform: scaleY(1); }
  }

  /* State: listening (user is typing) */
  #avatar-stage.state-listening #rig-character {
    transform: translateX(8px) rotate(2.5deg);
  }
  #avatar-stage.state-listening #pupil-l,
  #avatar-stage.state-listening #pupil-r {
    transform: translateX(5px);
  }
  #avatar-stage.state-listening #brow-l { transform: translateY(-3px); }
  #avatar-stage.state-listening #brow-r { transform: translateY(-3px); }
  #avatar-stage.state-listening #arm-left { transform: rotate(10deg); }

  /* State: greeting (wave mallet & big grin) */
  #avatar-stage.state-greeting #mouth-smile { display:none; }
  #avatar-stage.state-greeting #mouth-grin { display:block; }
  #avatar-stage.state-greeting #brow-l,
  #avatar-stage.state-greeting #brow-r { transform: translateY(-4px); }
  #avatar-stage.state-greeting #arm-left {
    animation: waveMallet 0.55s ease-in-out infinite alternate;
  }
  @keyframes waveMallet {
    0% { transform: rotate(-18deg); }
    100% { transform: rotate(28deg); }
  }

  /* State: teaching / speaking (talking mouth & rhythmic drum taps) */
  #avatar-stage.state-teaching.speaking #mouth-smile { display:none; }
  #avatar-stage.state-teaching.speaking #mouth-talk {
    display:block; transform-origin: 157px 244px;
    animation: talkMouth 0.22s ease-in-out infinite alternate;
  }
  #avatar-stage.state-teaching #arm-left {
    animation: drumTapLeft 0.5s ease-in-out infinite alternate;
  }
  #avatar-stage.state-teaching #arm-right {
    animation: drumTapRight 0.5s ease-in-out infinite alternate;
  }
  @keyframes talkMouth {
    0% { transform: scaleY(0.45); }
    100% { transform: scaleY(1.15); }
  }
  @keyframes drumTapLeft {
    0% { transform: rotate(-6deg); }
    100% { transform: rotate(14deg); }
  }
  @keyframes drumTapRight {
    0% { transform: rotate(10deg); }
    100% { transform: rotate(-14deg); }
  }

  /* State: celebrate / praise (happy ^ ^ eyes, fast drum roll, bounce) */
  #avatar-stage.state-celebrate #eyes-normal { display:none; }
  #avatar-stage.state-celebrate #eyes-happy { display:block; }
  #avatar-stage.state-celebrate #mouth-smile { display:none; }
  #avatar-stage.state-celebrate #mouth-grin { display:block; }
  #avatar-stage.state-celebrate #rig-character {
    animation: happyBounce 0.42s ease-in-out infinite alternate;
  }
  #avatar-stage.state-celebrate #arm-left {
    animation: drumTapLeft 0.18s ease-in-out infinite alternate;
  }
  #avatar-stage.state-celebrate #arm-right {
    animation: drumTapRight 0.18s ease-in-out infinite alternate;
  }
  @keyframes happyBounce {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-12px) scale(1.03, 0.98); }
  }

  /* State: thinking / hint (adjust glasses, raised brow) */
  #avatar-stage.state-thinking #mouth-smile { display:none; }
  #avatar-stage.state-thinking #mouth-think { display:block; }
  #avatar-stage.state-thinking #brow-l { transform: translateY(-5px) rotate(-6deg); }
  #avatar-stage.state-thinking #brow-r { transform: translateY(2px) rotate(6deg); }
  #avatar-stage.state-thinking #rig-glasses {
    animation: glassesNudge 0.8s ease-in-out infinite alternate;
  }
  #avatar-stage.state-thinking #arm-right {
    transform: rotate(-36deg) translateY(-14px);
  }
  @keyframes glassesNudge {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-3px) rotate(-2deg); }
  }

  /* State: comfort / confused (empathetic head tilt & gentle nod) */
  #avatar-stage.state-comfort #mouth-smile { display:none; }
  #avatar-stage.state-comfort #mouth-comfort { display:block; }
  #avatar-stage.state-comfort #brow-l { transform: rotate(8deg) translateY(-2px); }
  #avatar-stage.state-comfort #brow-r { transform: rotate(-8deg) translateY(-2px); }
  #avatar-stage.state-comfort #rig-character {
    animation: comfortNod 1.1s ease-in-out infinite alternate;
  }
  @keyframes comfortNod {
    0% { transform: rotate(-3deg) translateY(0); }
    100% { transform: rotate(3deg) translateY(-4px); }
  }

  /* State: six_seven (🤲 67 two-hand alternating juggle) */
  #avatar-stage.state-six_seven #mouth-smile { display:none; }
  #avatar-stage.state-six_seven #mouth-grin { display:block; }
  #avatar-stage.state-six_seven #arm-left {
    animation: juggle67Left 0.28s ease-in-out infinite alternate;
  }
  #avatar-stage.state-six_seven #arm-right {
    animation: juggle67Right 0.28s ease-in-out infinite alternate;
  }
  @keyframes juggle67Left {
    0% { transform: translateY(-16px) rotate(22deg); }
    100% { transform: translateY(12px) rotate(-14deg); }
  }
  @keyframes juggle67Right {
    0% { transform: translateY(12px) rotate(14deg); }
    100% { transform: translateY(-16px) rotate(-24deg); }
  }

  /* Right Chat Column (Replika floating bubble stream) */
  .chat-column {
    display:flex; flex-direction:column; min-height:0; height:100%;
    max-width:780px; width:100%;
  }
  #chat {
    flex:1; width:100%; overflow-y:auto; padding:12px 16px;
    display:flex; flex-direction:column; gap:12px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width:82%; padding:12px 16px; border-radius:18px;
    white-space:pre-wrap; line-height:1.48; font-size:.96rem;
    box-shadow: 0 4px 16px rgba(43,29,18,0.08);
    animation: popMsg 0.22s ease-out;
  }
  @keyframes popMsg {
    from { opacity:0; transform: translateY(8px) scale(0.98); }
    to { opacity:1; transform: translateY(0) scale(1); }
  }
  .bot {
    background: var(--glass-bot); backdrop-filter: blur(8px);
    color:#2b1d12; align-self:flex-start; border-bottom-left-radius:4px;
    border:1px solid rgba(215, 190, 150, 0.7);
  }
  .user {
    background: linear-gradient(135deg, var(--red), #911b21);
    color:#fff; align-self:flex-end; border-bottom-right-radius:4px;
  }

  #quickbar {
    width:100%; padding:6px 14px 4px;
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
  }
  .chip {
    background: rgba(255, 250, 242, 0.88); backdrop-filter: blur(6px);
    color:#2b1d12; border:1px solid var(--tan-dark); border-radius:999px;
    padding:6px 13px; font-size:.82rem; font-weight:600; cursor:pointer;
    transition: background .15s, transform .1s;
    box-shadow: 0 2px 8px rgba(43,29,18,0.06);
  }
  .chip:hover { background:var(--tan); transform: translateY(-1px); }
  .chip.primary { background:var(--brown); color:#fff; border-color:var(--brown); }
  .chip.primary:hover { background:var(--brown-dark); }
  select.chip-select {
    background: rgba(255, 250, 242, 0.9); color:#2b1d12; border:1px solid var(--tan-dark);
    border-radius:999px; padding:6px 12px; font-size:.82rem; font-weight:600; cursor:pointer;
  }

  /* Replika-style Rounded Pill Input Bar */
  form#form {
    width:100%; display:flex; align-items:center; gap:8px;
    padding:8px 14px 6px;
  }
  .input-pill {
    flex:1; display:flex; align-items:center;
    background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px);
    border:2px solid var(--tan-dark); border-radius:999px;
    padding:4px 6px 4px 18px;
    box-shadow: 0 8px 24px rgba(43,29,18,0.1);
    transition: border-color .2s;
  }
  .input-pill:focus-within { border-color:var(--red); }
  input#box {
    flex:1; border:0; background:transparent; padding:10px 6px;
    font-size:.98rem; color:#2b1d12; outline:none;
  }
  form#form button#send {
    padding:10px 22px; border:0; border-radius:999px;
    background:var(--brown); color:#fff; font-size:.94rem; font-weight:700; cursor:pointer;
    transition: background .15s;
  }
  form#form button#send:hover { background:var(--brown-dark); }
  form#form button#send:disabled { opacity:.5; }

  /* Modals */
  .modal { position:fixed; inset:0; background:#0008; display:none; align-items:center; justify-content:center; padding:12px; z-index:40; }
  .modal.open { display:flex; }
  .modalbox { background:#fff; border-radius:16px; max-width:680px; width:100%; max-height:90vh; overflow-y:auto; padding:20px 22px; box-shadow:0 20px 50px rgba(0,0,0,0.3); }
  .modalbox h2 { margin:0 0 4px; }
  .modalbox p.hint { margin:0 0 12px; color:#555; font-size:.9rem; }
  .tabs { display:flex; gap:6px; border-bottom:2px solid var(--tan); margin-bottom:12px; padding-bottom:8px; }
  .tabbtn { background:var(--tan); color:#2b1d12; border:0; border-radius:8px; padding:7px 14px; cursor:pointer; font-weight:600; font-size:.9rem; }
  .tabbtn.active { background:var(--brown); color:#fff; }
  .tabpane { display:none; }
  .tabpane.active { display:block; }
  .card { background:var(--cream); border:1px solid var(--tan-dark); border-radius:10px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .card-title { font-weight:700; color:var(--brown); }
  .card-sub { font-size:.88rem; color:#443020; margin-top:2px; }
  .badge-pill { display:inline-block; font-size:.75rem; padding:2px 8px; border-radius:999px; background:var(--tan); color:#2b1d12; margin-left:6px; }
  .badge-pill.done { background:#d4edda; color:#155724; }
  #gsearch { width:100%; padding:8px 12px; border:2px solid var(--tan); border-radius:8px; margin-bottom:10px; font-size:.92rem; }
  .q { padding:8px 0; border-bottom:1px solid var(--tan); }
  .q .opts { display:flex; gap:14px; margin-top:4px; }
  .q label { cursor:pointer; }
  .modalbox textarea { width:100%; margin-top:10px; padding:8px; border:2px solid var(--tan); border-radius:8px; font:inherit; }
  .row { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  .row button { padding:9px 18px; border:0; border-radius:8px; cursor:pointer; background:var(--brown); color:#fff; font-size:.95rem; }
  .row button.alt { background:var(--tan); color:#2b1d12; }
  #cuqmsg { color:var(--red); margin-top:8px; }

  /* Responsive mobile layout (like Replika mobile screenshot 2) */
  @media (max-width: 820px) {
    .stage-layout {
      grid-template-columns: 155px 1fr;
      gap: 6px; padding: 0 8px 8px;
    }
    #puppet-wrap { height: 290px; max-width: 155px; }
    .companion-card { padding: 7px 10px; flex-direction: column; align-items: flex-start; gap: 4px; }
    .nav-pills { display: none; }
    .msg { max-width: 94%; font-size: .9rem; padding: 10px 13px; }
  }
</style>
</head>
<body>

<div class="room-bg" aria-hidden="true">
  <div class="room-window"></div>
  <div class="room-shelf-1"></div>
  <div class="room-shelf-2"></div>
</div>

<header>
  <div class="brand-cluster">
    <div class="brand-mark" title="Guru Beleq">🥁</div>
    <div id="status" class="lvl-pill">
      <span id="badge">LVL 1 · Curious Listener</span>
      <div id="bar"><div></div></div>
    </div>
  </div>

  <nav class="nav-pills" aria-label="Companion navigation">
    <button type="button" class="nav-pill active" id="nav-chat">💬 Chat</button>
    <button type="button" class="nav-pill" id="explore">📚 Explore knowledge</button>
    <button type="button" class="nav-pill" id="nav-glossary">📖 Glossary</button>
    <button type="button" class="nav-pill" id="rate">⭐ Rate chatbot</button>
  </nav>

  <div class="action-cluster">
    <button class="small" id="export">Export chat</button>
    <button class="small" id="restart">Start over</button>
  </div>
</header>

<main class="stage-layout">
  <!-- Left Side: Replika-style Standing 2.5D Rigged Guru Beleq Companion -->
  <aside id="avatar-stage" class="state-greeting" aria-label="Guru Beleq interactive avatar">
    <div id="puppet-wrap" title="Click Guru Beleq to play the drum!">
      <div id="particles"></div>
      <svg id="guru-puppet" viewBox="0 0 360 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Guru Beleq animated drum teacher">
        <defs>
          <linearGradient id="woodBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a84e24"/>
            <stop offset="45%" stop-color="#873916"/>
            <stop offset="100%" stop-color="#53200a"/>
          </linearGradient>
          <radialGradient id="drumSkin" cx="45%" cy="42%" r="58%">
            <stop offset="0%" stop-color="#fff9eb"/>
            <stop offset="75%" stop-color="#f5e1b9"/>
            <stop offset="100%" stop-color="#dfbe84"/>
          </radialGradient>
          <linearGradient id="sapukRed" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#c92a33"/>
            <stop offset="55%" stop-color="#9c1920"/>
            <stop offset="100%" stop-color="#6e0e13"/>
          </linearGradient>
          <linearGradient id="sarongCloth" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7c1d24"/>
            <stop offset="100%" stop-color="#3e1216"/>
          </linearGradient>
        </defs>

        <!-- Floor Shadow -->
        <ellipse id="rig-shadow" cx="178" cy="414" rx="96" ry="16" fill="rgba(43, 29, 18, 0.22)"/>

        <g id="rig-character">
          <!-- Standing Legs & Traditional Sasak Bebet / Dodot Sarong -->
          <g id="rig-legs">
            <path d="M124 316 L226 316 L238 394 Q175 408 114 394 Z" fill="url(#sarongCloth)" stroke="#2b1206" stroke-width="4"/>
            <!-- Gold Songket geometric band on sarong -->
            <path d="M119 362 Q175 374 233 362 L235 376 Q175 388 117 376 Z" fill="#e6b347" opacity="0.88"/>
            <path d="M162 316 L188 316 L194 398 L156 398 Z" fill="#b3262d" stroke="#2b1206" stroke-width="3"/>
            <!-- Feet -->
            <ellipse cx="142" cy="404" rx="22" ry="10" fill="#6b3416" stroke="#2b1206" stroke-width="3.5"/>
            <ellipse cx="210" cy="404" rx="22" ry="10" fill="#6b3416" stroke="#2b1206" stroke-width="3.5"/>
          </g>

          <!-- Cylindrical Gendang Beleq Drum Body (2.5D perspective) -->
          <g id="rig-torso">
            <!-- Rear drum rim -->
            <ellipse cx="242" cy="222" rx="46" ry="92" fill="#4a1d09" stroke="#2b1206" stroke-width="4.5"/>
            <!-- Main mahogany cylinder -->
            <path d="M156 122 L244 130 A46 92 0 0 1 244 314 L156 322 Z" fill="url(#woodBody)" stroke="#2b1206" stroke-width="4.5"/>
            <!-- Carved Sasak wood bands -->
            <path d="M225 130 A44 90 0 0 1 225 314" fill="none" stroke="#d99b43" stroke-width="5" opacity="0.65"/>
            <!-- Authentic Zig-Zag Rope Lacing (Tali Jangat) -->
            <path d="M168 136 L248 158 L174 176 L254 200 L176 222 L254 246 L172 270 L246 290 L166 308"
                  fill="none" stroke="#e9cfa1" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M168 136 L248 158 L174 176 L254 200 L176 222 L254 246 L172 270 L246 290 L166 308"

<script>
const chat = document.getElementById('chat'), box = document.getElementById('box'), send = document.getElementById('send');
const quickbar = document.getElementById('quickbar');
const avatarStage = document.getElementById('avatar-stage');
const puppetWrap = document.getElementById('puppet-wrap');
const moodPill = document.getElementById('mood-pill');
const particles = document.getElementById('particles');
const pupilL = document.getElementById('pupil-l'), pupilR = document.getElementById('pupil-r');

let tid = null, currentStage = 'ask_name', currentProgress = null, meta = null, historyLog = [];
let reactionTimer = null, speakTimer = null, lastReaction = 'greeting';

const REACTION_META = {
  idle:      { label: '🥁 Ready to teach', bursts: [] },
  listening: { label: '👂 Listening...', bursts: [] },
  greeting:  { label: '👋 Greeting you', bursts: ['👋', '🥁', '✨'] },
  teaching:  { label: '🥁 Explaining...', bursts: ['🥁', '🎶'] },
  celebrate: { label: '🎉 Spot on!', bursts: ['🎵', '🎶', '✨', '🌟', '🥁'] },
  thinking:  { label: '💡 Hint & clue', bursts: ['💡', '🤔'] },
  comfort:   { label: '💛 Taking it slow', bursts: ['💛', '✨'] },
  six_seven: { label: '🤲 67!', bursts: ['🤲', '6️⃣', '7️⃣', '✨'] },
};

function spawnParticles(icons) {
  if (!icons || !icons.length) return;
  icons.forEach((icon, i) => {
    setTimeout(() => {
      const el = document.createElement('span');
      el.className = 'particle';
      el.textContent = icon;
      el.style.left = (32 + Math.random() * 40) + '%';
      el.style.top = (18 + Math.random() * 32) + '%';
      particles.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }, i * 130);
  });
}

function setAvatarReaction(state, speaking = false) {
  const clean = REACTION_META[state] ? state : 'idle';
  if (clean !== 'listening') lastReaction = clean;
  avatarStage.className = 'state-' + clean + (speaking ? ' speaking' : '');
  const info = REACTION_META[clean] || REACTION_META.idle;
  moodPill.textContent = info.label;
  if (info.bursts.length) spawnParticles(info.bursts);

  clearTimeout(speakTimer);
  clearTimeout(reactionTimer);
  if (speaking) {
    speakTimer = setTimeout(() => avatarStage.classList.remove('speaking'), 2400);
  }
  if (clean !== 'idle' && clean !== 'listening') {
    reactionTimer = setTimeout(() => {
      avatarStage.className = 'state-idle';
      moodPill.textContent = REACTION_META.idle.label;
    }, 4200);
  }
}

// Synthesize a gentle traditional drum thump when clicking Guru Beleq
function playDrumSound() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(145, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(52, ctx.currentTime + 0.22);
    gain.gain.setValueAtTime(0.28, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.24);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.25);
  } catch {}
}

puppetWrap.addEventListener('click', () => {
  playDrumSound();
  setAvatarReaction('celebrate', false);
});

// 2.5D Mouse Parallax & Eye Tracking
window.addEventListener('mousemove', e => {
  const rect = puppetWrap.getBoundingClientRect();
  if (!rect.width) return;
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dx = Math.max(-1, Math.min(1, (e.clientX - cx) / 280));
  const dy = Math.max(-1, Math.min(1, (e.clientY - cy) / 280));
  puppetWrap.style.transform = `rotateY(${dx * 8}deg) rotateX(${-dy * 6}deg)`;
  if (!avatarStage.classList.contains('state-listening')) {
    const px = (dx * 4.5).toFixed(1), py = (dy * 3.5).toFixed(1);
    pupilL.style.transform = `translate(${px}px, ${py}px)`;
    pupilR.style.transform = `translate(${px}px, ${py}px)`;
  }
});

// React when user types in the input box
box.addEventListener('input', () => {
  if (box.value.trim().length > 0) {
    pupilL.style.transform = '';
    pupilR.style.transform = '';
    setAvatarReaction('listening', false);
  } else {
    setAvatarReaction('idle', false);
  }
});

function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  historyLog.push({role: role === 'bot' ? 'Guru Beleq' : 'You', text});
}

function showProgress(p) {
  currentProgress = p;
  if (!p) {
    document.getElementById('badge').textContent = 'LVL 1 · Curious Listener';
    document.querySelector('#bar div').style.width = '0';
    return;
  }
  const lvl = p.level || 1;
  const quiz = p.quiz_total ? ` · Quiz ${p.quiz_right}/${p.quiz_total}` : '';
  document.getElementById('badge').textContent = `LVL ${lvl} · ${p.badge} (${p.done}/${p.total}${quiz})`;
  document.querySelector('#bar div').style.width = (100 * p.done / p.total) + '%';
}

function makeChip(label, msg, primary = false) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip' + (primary ? ' primary' : '');
  b.textContent = label;
  b.onclick = () => sendMessage(msg);
  return b;
}

function renderQuickbar(stage) {
  currentStage = stage || 'menu';
  quickbar.innerHTML = '';
  if (currentStage === 'ask_name') return;
  if (currentStage === 'lesson') {
    quickbar.append(
      makeChip('💡 Hint', 'hint', true),
      makeChip('🔁 Repeat step', 'repeat'),
      makeChip('⏭️ Skip question', 'skip'),
      makeChip('⏹️ Leave lesson', 'stop')
    );
    return;
  }
  if (currentStage === 'quiz') {
    quickbar.append(
      makeChip('💡 Hint', 'hint', true),
      makeChip('⏭️ Skip question', 'skip'),
      makeChip('⏹️ Stop quiz', 'stop')
    );
    return;
  }
  quickbar.append(
    makeChip('1. Start lesson', '1', true),
    makeChip('2. Ask question', '2'),
    makeChip('3. Take quiz', '3'),
    makeChip('4. Recommend', '4'),
    makeChip('5. Progress', '5'),
    makeChip('6. Help', '6'),
    makeChip('7. Sources', '7'),
    makeChip('8. Glossary', '8')
  );
  if (meta && meta.topics) {
    const sel = document.createElement('select');
    sel.className = 'chip-select';
    sel.setAttribute('aria-label', 'Jump to a specific lesson');
    const def = document.createElement('option');
    def.value = '';
    def.textContent = 'Choose a lesson topic...';
    sel.appendChild(def);
    meta.topics.forEach((t, idx) => {
      const o = document.createElement('option');
      o.value = `teach me about ${t.title.toLowerCase()}`;
      o.textContent = `Lesson ${idx + 1}: ${t.title}`;
      sel.appendChild(o);
    });
    sel.onchange = () => { if (sel.value) { sendMessage(sel.value); sel.value = ''; } };
    quickbar.appendChild(sel);
  }
}

async function post(url, body) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body || {})});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function loadMeta() {
  if (meta) return meta;
  try { meta = await (await fetch('/api/meta')).json(); } catch { meta = null; }
  return meta;
}

async function begin() {
  chat.innerHTML = ''; historyLog = []; showProgress(null);
  await loadMeta();
  try {
    const d = await post('/api/start');
    tid = d.thread_id;
    add('bot', d.reply);
    renderQuickbar(d.stage || 'ask_name');
    setAvatarReaction(d.reaction || 'greeting', true);
  } catch {
    add('bot', 'Sorry, I could not reach the server. Is server.py running?');
    setAvatarReaction('comfort', false);
  }
}

async function sendMessage(text) {
  const clean = (text || '').trim();
  if (!clean || !tid || send.disabled) return;
  box.value = ''; add('user', clean); send.disabled = true;
  try {
    const d = await post('/api/chat', {thread_id: tid, message: clean});
    add('bot', d.reply);
    showProgress(d.progress);
    renderQuickbar(d.stage || 'menu');
    setAvatarReaction(d.reaction || 'teaching', true);
  } catch {
    add('bot', 'Sorry, something went wrong talking to the server.');
    setAvatarReaction('comfort', false);
  }
  send.disabled = false; box.focus();
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  sendMessage(box.value);
});
document.getElementById('restart').onclick = begin;
document.getElementById('nav-chat').onclick = () => box.focus();

// ---- Export Chat Transcript ----
document.getElementById('export').onclick = () => {
  if (!historyLog.length) return;
  const header = `Guru Beleq - Learning Transcript\n` +
    (currentProgress ? `Status: ${currentProgress.badge} | Lessons: ${currentProgress.done}/${currentProgress.total} | Quiz: ${currentProgress.quiz_right}/${currentProgress.quiz_total}\n` : '') +
    `==================================================\n\n`;
  const body = historyLog.map(m => `[${m.role}]\n${m.text}\n`).join('\n');
  const blob = new Blob([header + body], {type: 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'guru-beleq-transcript.txt';
  a.click();
  URL.revokeObjectURL(a.href);
};

// ---- Explore Knowledge Modal ----
const exploreModal = document.getElementById('exploreModal');
function activateExploreTab(tabId) {
  document.querySelectorAll('.tabbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  document.querySelectorAll('.tabpane').forEach(p => p.classList.toggle('active', p.id === tabId));
}
document.querySelectorAll('.tabbtn').forEach(btn => {
  btn.onclick = () => activateExploreTab(btn.dataset.tab);
});

function renderExplore() {
  if (!meta) return;
  const doneSet = new Set((currentProgress && currentProgress.lessons_done) || []);
  const lessonsEl = document.getElementById('tab-lessons');
  lessonsEl.innerHTML = '';
  meta.topics.forEach((t, i) => {
    const c = document.createElement('div'); c.className = 'card';
    const left = document.createElement('div');
    const title = document.createElement('div'); title.className = 'card-title';
    title.textContent = `Lesson ${i + 1}: ${t.title}`;
    const pill = document.createElement('span');
    pill.className = 'badge-pill' + (doneSet.has(t.id) ? ' done' : '');
    pill.textContent = doneSet.has(t.id) ? '✓ Completed' : 'To learn';
    title.appendChild(pill);
    const sub = document.createElement('div'); sub.className = 'card-sub';
    sub.textContent = t.summary;
    left.append(title, sub);
    const act = document.createElement('button');
    act.type = 'button'; act.className = 'chip primary';
    act.textContent = 'Start lesson';
    act.onclick = () => {
      exploreModal.classList.remove('open');
      sendMessage(`teach me about ${t.title.toLowerCase()}`);
    };
    c.append(left, act);
    lessonsEl.appendChild(c);
  });

  renderGlossaryList('');
  const netEl = document.getElementById('tab-net');
  netEl.innerHTML = '';
  meta.edges.forEach(e => {
    const c = document.createElement('div'); c.className = 'card';
    const d = document.createElement('div');
    d.innerHTML = `<span class="card-title"></span> &rarr; <em></em> &rarr; <span class="card-title"></span> <small></small>`;
    const spans = d.querySelectorAll('.card-title');
    spans[0].textContent = e.s;
    spans[1].textContent = e.o;
    d.querySelector('em').textContent = e.r;
    d.querySelector('small').textContent = e.cite;
    c.appendChild(d);
    netEl.appendChild(c);
  });
}

function renderGlossaryList(filter) {
  if (!meta) return;
  const glist = document.getElementById('glist');
  glist.innerHTML = '';
  const q = (filter || '').toLowerCase();
  meta.glossary.filter(g => !q || g.term.toLowerCase().includes(q) || g.meaning.toLowerCase().includes(q)).forEach(g => {
    const c = document.createElement('div'); c.className = 'card';
    const left = document.createElement('div');
    const t = document.createElement('div'); t.className = 'card-title'; t.textContent = g.term;
    const m = document.createElement('div'); m.className = 'card-sub'; m.textContent = `${g.meaning} ${g.cite}`;
    left.append(t, m);
    const askBtn = document.createElement('button');
    askBtn.type = 'button'; askBtn.className = 'chip';
    askBtn.textContent = 'Ask Guru';
    askBtn.onclick = () => {
      exploreModal.classList.remove('open');
      sendMessage(`what is ${g.term}?`);
    };
    c.append(left, askBtn);
    glist.appendChild(c);
  });
}

document.getElementById('gsearch').addEventListener('input', e => renderGlossaryList(e.target.value));
document.getElementById('explore').onclick = async () => {
  await loadMeta();
  renderExplore();
  activateExploreTab('tab-lessons');
  exploreModal.classList.add('open');
};
document.getElementById('nav-glossary').onclick = async () => {
  await loadMeta();
  renderExplore();
  activateExploreTab('tab-glossary');
  exploreModal.classList.add('open');
};
document.getElementById('exploreClose').onclick = () => exploreModal.classList.remove('open');

// ---- Chatbot Usability Questionnaire (CUQ) ----
const cuqEl = document.getElementById('cuq'), cuqMsg = document.getElementById('cuqmsg');
let cuqLoaded = false;
async function openCuq() {
  cuqEl.classList.add('open'); cuqMsg.textContent = '';
  if (cuqLoaded) return;
  const d = await (await fetch('/api/cuq')).json();
  document.getElementById('scale').textContent = d.scale + '. Your answers are anonymous.';
  const qs = document.getElementById('qs');
  d.items.forEach((item, i) => {
    const q = document.createElement('div'); q.className = 'q';
    q.append(`${i + 1}. ${item}`);
    const o = document.createElement('div'); o.className = 'opts';
    for (let v = 1; v <= 5; v++) {
      const l = document.createElement('label'), r = document.createElement('input');
      r.type = 'radio'; r.name = 'q' + i; r.value = v; r.style.cssText = 'flex:none;width:auto;padding:0;border:0;margin-right:3px';
      l.append(r, v); o.append(l);
    }
    q.append(o); qs.append(q);
  });
  cuqLoaded = true;
}
document.getElementById('rate').onclick = () => openCuq().catch(() => alert('Could not load the questionnaire.'));
document.getElementById('cuqclose').onclick = () => cuqEl.classList.remove('open');
document.getElementById('cuqform').addEventListener('submit', async e => {
  e.preventDefault();
  const answers = [];
  for (let i = 0; i < 16; i++) {
    const c = document.querySelector(`input[name=q${i}]:checked`);
    if (!c) { cuqMsg.textContent = `Please answer question ${i + 1}.`; return; }
    answers.push(+c.value);
  }
  try {
    const d = await post('/api/cuq', {answers, comments: document.getElementById('comments').value});
    cuqMsg.style.color = '#1b6e2d';
    const note = d.saved === false ? ' (The online demo does not store responses.)' : '';
    cuqMsg.textContent = `Thank you! Your score: ${d.score} out of 100.${note}`;
    document.getElementById('cuqform').reset();
    setAvatarReaction('celebrate', false);
    setTimeout(() => { cuqEl.classList.remove('open'); cuqMsg.style.color = ''; }, 2500);
  } catch { cuqMsg.textContent = 'Sorry, your answers could not be saved.'; }
});
begin();
</script>
